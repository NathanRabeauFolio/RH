name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint PHP
        run: |
          find app public -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate health endpoint
        run: php public/health.php
      - name: Verify RH employee configuration and calendar
        run: php scripts/check_v2bis.php
      - name: Validate deployment shell syntax and UI JavaScript
        run: |
          bash -n deploy/deploy_release.sh
          bash -n deploy/deploy_rh_live.sh
          node --check public/assets/js/app.js
      - name: Smoke test isolated PHP application (login, saves, roles, exports)
        run: bash scripts/smoke_v2bis.sh
