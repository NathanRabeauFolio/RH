name: Deploy to Lightsail

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Lint PHP before deploy
        run: find app public -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build release archive
        run: |
          tar             --exclude='.git'             --exclude='.github'             --exclude='storage/uploads/*'             --exclude='storage/submissions/*.json'             --exclude='docker'             --exclude='docs/screenshots'             -czf release.tar.gz .

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s
' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s
' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload archive to Lightsail
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -P "$DEPLOY_PORT" release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/mak-galerie-admin-tool-${GITHUB_SHA}.tar.gz"

      - name: Run remote deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST"             "APP_ROOT='$DEPLOY_PATH' RELEASE_ARCHIVE='/tmp/mak-galerie-admin-tool-${GITHUB_SHA}.tar.gz' RELEASE_SHA='${GITHUB_SHA}' bash -s"             < deploy/deploy_release.sh

      - name: Post-deploy health check
        if: ${{ secrets.APP_HEALTHCHECK_URL != '' }}
        env:
          APP_HEALTHCHECK_URL: ${{ secrets.APP_HEALTHCHECK_URL }}
        run: curl --fail --silent --show-error "$APP_HEALTHCHECK_URL"
