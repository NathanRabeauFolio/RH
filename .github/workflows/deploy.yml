name: Deploy RH to Lightsail
on:
  push:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Verify release
        run: |
          find app public scripts -name '*.php' -print0 | xargs -0 -n1 php -l
          php public/health.php
          php scripts/check_v2bis.php
          node --check public/assets/js/app.js
          bash -n deploy/deploy_rh_live.sh
      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.LIGHTSAIL_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_PRIVATE_KEY" && test -n "$DEPLOY_KNOWN_HOSTS" || { echo "Missing SSH key or pinned known_hosts secret"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Deploy to verified RH checkout
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || secrets.LIGHTSAIL_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || secrets.LIGHTSAIL_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "RELEASE_SHA='$GITHUB_SHA' bash -s" < deploy/deploy_rh_live.sh
