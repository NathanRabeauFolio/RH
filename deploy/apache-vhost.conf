<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/mak-galerie-admin/current/public

    <Directory /var/www/mak-galerie-admin/current/public>
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/mak-galerie-admin/shared/storage>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/mak-admin-error.log
    CustomLog ${APACHE_LOG_DIR}/mak-admin-access.log combined
</VirtualHost>
